[package]
name = "teleport"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
description = "Native Linux desktop sharing over Media over QUIC"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
gstreamer = { version = "0.24", features = ["v1_24"] }
gstreamer-app = { version = "0.24", features = ["v1_24"] }
gstreamer-video = { version = "0.24", features = ["v1_24"] }
sdl2 = { version = "0.38", features = ["ttf"] }
subtle = "2"
spake2 = "0.4"
ring = "0.17"
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
argon2 = "0.5"
sha2 = "0.10"
rand08 = { package = "rand", version = "0.8" }
rpassword = "7"
zeroize = "1"
libloading = "0.8"
libc = "0.2"
moq-net = "=0.2.20"
moq-native = { version = "=0.19.17", default-features = false, features = ["quinn", "ring"] }
bytes = "1"
url = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["xtest", "randr"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
