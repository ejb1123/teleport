# Teleport unattended start: SDDM logs USER in at boot, and
# teleport-lock-on-login.service (enabled for USER) locks the session at
# once. The NixOS module's `unattended.enable` writes the same. An opt-in
# example, not active until copied; as root:
#
#   install -m 0644 /usr/share/teleport/examples/sddm-autologin.conf \
#     /etc/sddm.conf.d/teleport-autologin.conf
#
# then replace USER with the account that runs the host. Session is the file
# name in /usr/share/wayland-sessions (plasma.desktop: Plasma 6 on Wayland).
# Relogin=false: only at boot, not again after logging out. Read the security
# notes first: /usr/share/doc/teleport/wake-and-unattended.md, "Security
# trade-offs" (the desktop is visible for a moment before it locks, and
# keyrings stay locked).
[Autologin]
User=USER
Session=plasma.desktop
Relogin=false
