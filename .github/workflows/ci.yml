name: Build and test
on:
  push:
    # Version tags run the release workflow instead.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Ignored test suites that are NOT run here, because a GitHub ubuntu-24.04
# runner cannot: network, p2p and wake (unprivileged user/network
# namespaces, which Ubuntu's AppArmor restricts), audio_latency (a PipeWire
# session), virtual_display (nested KWin and its portal), mac_surface
# (VideoToolbox hardware). relay and guests run locally but are not reliable
# yet under load (docs/todo.md). Tests inside the suites below that need
# /dev/uinput or a GPU skip with a SKIPPED line under
# TELEPORT_TEST_SKIP_UNAVAILABLE=1 (src/test_env.rs), or without
# TELEPORT_TEST_HARDWARE=1 / TELEPORT_TEST_PORTAL=1.
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      TELEPORT_TEST_SKIP_UNAVAILABLE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Caches the store paths this job builds (the teleport package, the
      # bundle) and fetches; cache.nixos.org still serves nixpkgs.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Formatting
        run: nix develop --command bash -c 'cargo fmt --check && nixfmt --check flake.nix nix/*.nix'
      - name: PipeWire HDR negotiation regression
        if: runner.os == 'Linux'
        run: nix build .#checks.x86_64-linux.pipewire-hdr --no-link
      - name: Lints and unit tests
        run: nix develop --command bash -c 'cargo clippy --locked --all-targets -- -D warnings && cargo test --locked'
      - name: Real QUIC video, authentication, X11 input and native window tests
        if: runner.os == 'Linux'
        run: nix develop --command cargo test --locked --test smoke --test multi_monitor --test ffmpeg_interop -- --ignored --nocapture
      - name: Legacy GStreamer and direct FFmpeg library integration tests
        if: runner.os == 'Linux'
        run: |
          # The NV12 renderer test needs an X display and SDL's OpenGL
          # renderer. The runner has no GPU and no /run/opengl-driver, so give
          # it the flake's Mesa (llvmpipe), as the packaged wrapper does
          # (nix/mesa-runtime.sh).
          mesa=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa)
          "$(nix develop --command sh -c 'command -v Xvfb')" :99 -screen 0 1280x720x24 -nolisten tcp &
          xvfb=$!
          trap 'kill "$xvfb"' EXIT
          for _ in $(seq 100); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          nix develop --command env TELEPORT_VIDEO_BACKEND=gstreamer DISPLAY=:99 \
            LD_LIBRARY_PATH="$mesa/lib" LIBGL_DRIVERS_PATH="$mesa/lib/dri" \
            __EGL_VENDOR_LIBRARY_FILENAMES="$mesa/share/glvnd/egl_vendor.d/50_mesa.json" \
            cargo test --locked --bin teleport -- --ignored --nocapture
      - name: Native toolbar and launcher interaction tests
        if: runner.os == 'Linux'
        run: nix develop --command cargo test --locked --test ui -- --ignored --nocapture
      - name: Host settings, revocation and agent forwarding
        if: runner.os == 'Linux'
        run: nix develop --command cargo test --locked --test host_ui --test access_smoke --test forwarding_smoke -- --ignored --nocapture
      - name: Build wrapped native package
        run: nix build --print-build-logs
      - name: Check packaged media plugins
        run: ./result/bin/teleport doctor
      - name: Check Linux package with foreign SDL and font configuration
        if: runner.os == 'Linux'
        run: nix develop --command env TELEPORT_TEST_BINARY=./result/bin/teleport cargo test --locked --test package_env -- --ignored --nocapture
      - name: Check Linux desktop entry
        if: runner.os == 'Linux'
        run: test -f result/share/applications/teleport.desktop
      - name: Check Nix-dependent Mac application launcher
        if: runner.os == 'macOS'
        run: test -x result/Applications/Teleport.app/Contents/MacOS/teleport
      - name: Test packaged host/client without development plugin paths
        if: runner.os == 'Linux'
        run: nix develop --command env TELEPORT_TEST_BINARY=./result/bin/teleport cargo test --locked --test smoke -- --ignored --nocapture
      - name: Test packaged native UI
        if: runner.os == 'Linux'
        run: nix develop --command env TELEPORT_TEST_BINARY=./result/bin/teleport cargo test --locked --test ui -- --ignored --nocapture
      - name: Test packaged host settings and forwarding
        if: runner.os == 'Linux'
        run: nix develop --command env TELEPORT_TEST_BINARY=./result/bin/teleport cargo test --locked --test host_ui --test access_smoke --test forwarding_smoke -- --ignored --nocapture
